project:
  type: website
  output-dir: _site
  # Render everything EXCEPT the private lecturer folder. Without this, any .qmd
  # dropped into lecturer/ would be published to the student-facing site.
  render:
    - "*.qmd"
    - "notes/*.qmd"
    - "labs/*.qmd"
    - "reference/*.qmd"
    - "demos/*.qmd"
    - "!lecturer/"
  # All chunks execute with the PROJECT ROOT as the working directory, so every
  # file can write data/tidebreak_sessions.csv regardless of which folder it is in.
  execute-dir: project

execute:
  freeze: auto      # re-run a page only when its .qmd changes
  warning: false
  message: false

website:
  title: "Playtest Analytics"
  description: "Measurement, description and evidence for game developers. COMP I8015, DkIT."
  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 3
    contents:
      - text: "Start here"
        href: index.qmd
      # Notes are grouped into six parts. Draft pages stay commented out until
      # their rebuild stage: a draft listed here still gets prev/next and
      # breadcrumb links pointing at an empty page.
      - section: "Notes"
        contents:
          - section: "0 · Start here"
            contents:
              # - notes/00-start-here.qmd        (draft: add in Stage 7)
              - notes/ten-rules.qmd
          - section: "1 · Foundations"
            contents:
              - notes/01-planning-a-playtest.qmd
              # - notes/02-r-first-principles.qmd        (draft: add in Stage 1)
              # - notes/03-data-and-types.qmd        (draft: add in Stage 2)
          - section: "2 · Describing"
            contents:
              - notes/04-describing-variables.qmd
              - notes/05-distributions-and-shape.qmd
          - section: "3 · Preparing"
            contents:
              - notes/06-cleaning-and-transforming.qmd
          - section: "4 · Comparing"
            contents:
              # - notes/07-sample-to-population.qmd        (draft: add in Stage 4)
              - notes/08-comparing-groups.qmd
          - section: "5 · Relationships"
            contents:
              - notes/09-visualising-with-ggplot2.qmd
              # - notes/10-relationships-and-regression.qmd        (draft: add in Stage 6)
          - section: "6 · Communicating"
            contents:
              - notes/11-reporting-evidence.qmd
      - section: "Labs"
        contents:
          - labs/setting-up.qmd
          - labs/reading-data.qmd
          - labs/comparing-builds.qmd
          - labs/complete-analysis.qmd
      - section: "Reference"
        contents:
          - reference/reference-statistics.qmd
          - reference/r-quarto-reference.qmd
          - reference/reference-ggplot2.qmd
      - section: "Demos"
        contents:
          - demos/week-1.qmd
          - demos/week-2.qmd
          - demos/week-3.qmd
  page-footer:
    center: "COMP I8015 · 3D Game Development · Dundalk Institute of Technology"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    df-print: default
    fig-width: 8
    fig-height: 5
